<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parol bardoshliligi tahlilchisi</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#f5f7fb;color:#1b2433;margin:0}
.w{max-width:720px;margin:0 auto;padding:20px 16px}
.c{background:#fff;border:1px solid #dde3ee;border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.5rem;margin:0 0 4px}.m{color:#5d6b82;font-size:.9rem}
.r{display:flex;gap:8px}
input{flex:1;font-size:1.1rem;padding:12px;border:1px solid #dde3ee;border-radius:10px}
button{padding:10px 14px;border:1px solid #dde3ee;border-radius:10px;background:#fff;cursor:pointer;font-size:1rem}
.bar{height:12px;background:#e6ebf4;border-radius:99px;overflow:hidden;margin:14px 0 6px}
#f{height:100%;width:0;transition:width .3s,background .3s}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:7px;border-bottom:1px solid #dde3ee}
li{margin:4px 0}
</style>
</head>
<body>
<div class="w">
<h1>🔐 Parol bardoshliligi tahlilchisi</h1>
<p class="m">Fan: Bulutli texnologiyalar. Tahlil Vercel Serverless Function (bulut) da bajariladi.</p>

<div class="c">
  <div class="r"><input id="pw" type="password" placeholder="Parolni kiriting" autocomplete="off">
  <button id="eye" type="button">👁</button></div>
  <div class="bar"><div id="f"></div></div>
  <b id="lv">—</b> <span class="m" id="info"></span>
  <p class="m" id="status"></p>
</div>

<div class="c"><b>Tavsiyalar va topilgan muammolar</b><ul id="ml"></ul></div>

<div class="c"><b>Buzish vaqti (taxminiy)</b>
<table><thead><tr><th>Stsenariy</th><th>Tezlik</th><th>Vaqt</th></tr></thead><tbody id="tm"></tbody></table>
<p class="m">Bulutda GPU klasterini ijaraga olish hujumchi quvvatini keskin oshiradi.</p></div>
</div>

<script>
// 1) AWS Lambda Function URL ni shu yerga qo'ying (oxiridagi / bo'lishi mumkin)
var API = "/api/tahlil";

var RATES=[["Onlayn hujum",100,"100 / s"],["Bitta GPU (oflayn)",1e10,"10 mlrd / s"],["Bulutdagi GPU klaster",1e12,"1 trln / s"]];
var COL=["#dc2626","#ea580c","#ca8a04","#16a34a","#0d9488"];
var $=function(i){return document.getElementById(i)}, timer;

function fmt(s){
  if(s<1)return "bir zumda";
  var u=[["yil",31557600],["kun",86400],["soat",3600],["daqiqa",60],["soniya",1]];
  if(s>=31557600*1e9)return "milliardlab yillar";
  if(s>=31557600*1e6)return Math.round(s/31557600/1e6)+" mln yil";
  for(var i=0;i<u.length;i++)if(s>=u[i][1])return Math.floor(s/u[i][1]).toLocaleString("en")+" "+u[i][0];
  return "bir zumda";
}
function localEnt(p){
  var pool=(/[a-z]/.test(p)?26:0)+(/[A-Z]/.test(p)?26:0)+(/\d/.test(p)?10:0)+(/[^A-Za-z0-9]/.test(p)?33:0);
  return p.length*Math.log2(pool||1);
}
function show(d){
  var i=d.ball<20?0:d.ball<40?1:d.ball<60?2:d.ball<80?3:4;
  $("f").style.width=Math.max(d.ball,4)+"%"; $("f").style.background=COL[i];
  $("lv").textContent=d.daraja; $("lv").style.color=COL[i];
  $("info").textContent="Ball: "+d.ball+"/100, entropiya: "+d.entropiya+" bit"+(d.oshkorSoni>0?", oshkor bo'lgan: "+d.oshkorSoni+" marta":"");
  $("ml").innerHTML=(d.muammolar.length?d.muammolar:["Ajoyib parol! Har sayt uchun alohida parol ishlating."]).map(function(x){return "<li>"+x+"</li>"}).join("");
  var c=Math.pow(2,d.entropiya)/2;
  $("tm").innerHTML=RATES.map(function(r){return "<tr><td>"+r[0]+"</td><td>"+r[2]+"</td><td><b>"+fmt(c/r[1])+"</b></td></tr>"}).join("");
}
function reset(){
  $("f").style.width="0";$("lv").textContent="—";$("info").textContent="";$("ml").innerHTML="";$("status").textContent="";
  $("tm").innerHTML=RATES.map(function(r){return "<tr><td>"+r[0]+"</td><td>"+r[2]+"</td><td>—</td></tr>"}).join("");
}
async function tekshir(){
  var p=$("pw").value; if(!p){reset();return}
  $("status").textContent="Bulutdagi serverless funksiyaga yuborilmoqda…";
  try{
    var r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})});
    var d=await r.json(); show(d); $("status").textContent="✓ Natija bulutdagi serverless funksiyadan olindi";
  }catch(e){
    var en=Math.round(localEnt(p)), b=Math.min(100,Math.round(en/80*100));
    show({ball:b,entropiya:en,daraja:b<20?"Juda zaif":b<40?"Zaif":b<60?"O'rtacha":b<80?"Kuchli":"Juda kuchli",oshkorSoni:0,muammolar:[]});
    $("status").textContent="⚠ Serverga ulanib bo'lmadi, oddiy (mahalliy) hisob ko'rsatilmoqda";
  }
}
$("pw").addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(tekshir,500)});
$("eye").addEventListener("click",function(){$("pw").type=$("pw").type==="password"?"text":"password"});
reset();
</script>
</body>
</html>
